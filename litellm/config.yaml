model_list:
  - model_name: local-primary
    litellm_params:
      model: openai/Qwen/Qwen3-32B-AWQ
      api_base: http://127.0.0.1:8000/v1
      api_key: sk-local
  - model_name: local-fast
    litellm_params:
      model: openai/Qwen/Qwen3-32B-AWQ
      api_base: http://127.0.0.1:8000/v1
      api_key: sk-local
  - model_name: local-coder
    litellm_params:
      model: openai/local-coder            # uncensored Ornith-35B executor (Spark A)
      api_base: http://100.111.220.1:18082/v1
      api_key: local-inference
  - model_name: local-driver
    litellm_params:
      model: openai/local-driver           # uncensored Qwen3.6-35B-A3B driver (Spark B)
      api_base: http://100.92.253.61:18090/v1
      api_key: local-inference
  # Retired 2026-08-01: local-glm52 (meshed GLM-5.2, too slow at 7 tok/s) and
  # local-dgx-smoke (dead). Both Sparks now run independent MoE lanes:
  # Spark A :18082 = local-coder (Ornith), Spark B :18090 = local-driver (Qwen3.6-A3B).

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600
  num_retries: 1
  # Do not background-probe Dell :8000 / Spark from the proxy process.
  background_health_checks: false
  # Self-hosted Langfuse on Dell :3100. Keys + LANGFUSE_OTEL_HOST come from
  # gitignored .env.langfuse / .env.local (loaded by start_proxy.sh). Never
  # Langfuse Cloud; do not use legacy success_callback: ["langfuse"].
  callbacks: ["langfuse_otel"]

general_settings:
  # Master key is read from the environment (LOCAL_LITELLM_MASTER_KEY in
  # .env.local, gitignored). Never hardcode a real key here. start_proxy.sh
  # exports LITELLM_MASTER_KEY from that value before launching.
  master_key: os.environ/LITELLM_MASTER_KEY
  # LiteLLM >=1.74 looks up virtual keys in Postgres. With no DATABASE_URL,
  # a missing/wrong Bearer can 500 /v1/models ("No connected db") instead of
  # 401. Keep serving the configured aliases when the DB is absent.
  allow_requests_on_db_unavailable: true
