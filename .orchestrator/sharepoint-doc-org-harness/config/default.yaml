# Default harness config — override via HARNESS_CONFIG or config/local.yaml

sharepoint_sync_root: "C:/Users/vince/OneDrive - Petra Hygienic Systems Int Ltd/Vince Personal - Documents"
inbox_rel: "00_Inbox"
unsorted_rel: "00_Inbox/_Unsorted_Imports"
retry_rel: "00_Inbox/_Retry_Imports"
capture_from_desktop_rel: "00_Inbox/_from_desktop"
capture_from_documents_rel: "00_Inbox/_from_documents"
capture_from_downloads_rel: "00_Inbox/_from_downloads"
capture_from_mail_rel: "00_Inbox/_from_mail"

litellm:
  base_url: "http://100.103.33.54:4000/v1"
  classify_model: "local-driver"
  fallback_model: "local-coder"
  # Paid cloud bases are rejected by config validation
  forbid_host_substrings:
    - "api.openai.com"
    - "api.anthropic.com"
    - "api.x.ai"

horizon_days: 365
auto_archive: false
inbox_active_ceiling: 0
naming_mode: organizer
mail_lookback_days: 90
mail_remainder_after_proof: true
drain_map_path: "config/drain_map.yaml"
delete_duplicates: false

exclude_globs:
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/agentic-swarm/**"
  - "**/agentic-swarm-*/**"
  - "**/.venv/**"
  - "**/local-inference-canonical/**"
  - "**/$RECYCLE.BIN/**"
  - "**/System Volume Information/**"

skip_code_path_tokens:
  - "local-inference-canonical"

journal_path: "data/journal.sqlite3"
taxonomy_path: "config/taxonomy_prefixes.yaml"
correction_rules_path: "config/correction_rules.json"

# Delegated Graph (ADR 0026). No client secret. Token cache stays untracked.
graph:
  enabled: true
  site_url: "https://petrasoap.sharepoint.com/sites/VincePersonal"
  library: "Documents"
  tenant_id: "organizations"
  client_id: "14d82eec-204b-4c2f-b7e8-296a70dab67e"
  cache_path: "data/msal_graph_cache.bin"
  upn: "vince@petrasoap.com"
