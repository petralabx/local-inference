# Unit tests for local-inference Python tooling.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK (offline smoke tests)
        run: python -m pip install "$(grep '^mcp==' requirements.txt)"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Brand structure check
        run: python scripts/check-brand-repo-structure.py

  # One roll-up check per repo (TASK-3902): the one org ruleset requires `ci` in
  # every repo instead of each repo's job names.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")' > /dev/null
